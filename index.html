<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription manager</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <h1>Subscription manager</h1>
    <div id="dashboard">
        <h2>Subscription Dashboard</h2>
        <div id="loading-state">Loading ...</div>
        <div id="success-state">
            <div class="container">
                <h3>Subscriptions</h3>
                <div id="subscription-container"></div>
            </div>
            <div class="container">
                <h3>Filters</h3>
                <div class="inner-container" id="plan-filter-container"> </div>
                <div class="inner-container" id="status-filter-container"> </div>
            </div>
            <div class="container">
                <form id="subscription-form">
                    <fieldset>
                        <legend>Add Subscription</legend>
                        <p>
                            <label for="subscription-name">Name: </label>
                            <input type="text" id="subscription-name" required /> <br />
                            <span id="subscription-name-status"></span>
                        </p>
                        <p>
                            <label for="subscription-amount">Amount: </label>
                            <input type="number" id="subscription-amount" required min="0.01" step="0.01" /><br />
                            <span id="subscription-amount-status"></span>
                        </p>
                        <p>
                            <label for="plan-select">Plan:</label>
                            <select id="plan-select">
                            </select>
                        </p>
                        <p>
                            <label for="status-select">Status:</label>
                            <select id="status-select">
                            </select>
                        </p>
                        <p>
                            <label for="Subscription-date">Date: </label>
                            <input type="date" id="subscription-date" required />
                        </p>
                        <p>
                            <button type="submit" class="add-subscription">Add Subscription</button>
                        </p>
                    </fieldset>
                </form>
            </div>
            <div class="container">
                <h3>Summary</h3>
                <div id="summary-container"> </div>
            </div>
        </div>
        <div id="error-state">
            <p id="error-msg"></p>
            <button id="retry-btn">Retry</button>
        </div>

    </div>



    <script type="module" src="app.js"></script>
</body>

</html>
